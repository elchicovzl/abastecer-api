name: Deploy API

# Solo manual o tras un CI verde en main. Nunca en push directo: desplegar
# sin tests verdes es exactamente cómo se rompe producción un viernes.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build → GHCR → VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Si el CI falló, no se despliega. `workflow_dispatch` lo saltea a
    # propósito, para poder desplegar un rollback de urgencia.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          # Contexto = raíz del repo: es un monorepo con workspaces y el
          # package-lock vive arriba.
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          # La caché de GitHub Actions ahorra ~4 minutos por build.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar en el VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/asofer

            echo "→ Descargando imagen ${{ github.sha }}"
            echo "API_IMAGE=ghcr.io/${{ github.repository }}/api:${{ github.sha }}" > .image.env
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .image.env pull api

            echo "→ Migrando la base"
            # `migrate deploy` NUNCA borra datos: solo aplica migraciones
            # pendientes. Es el único comando de Prisma apto para producción.
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .image.env \
              run --rm api npx prisma migrate deploy

            echo "→ Levantando la nueva versión"
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .image.env up -d api

            echo "→ Esperando health check"
            for i in $(seq 1 30); do
              if curl -fsS https://${{ secrets.API_DOMAIN }}/api/health > /dev/null; then
                echo "✅ API saludable"
                docker image prune -f
                exit 0
              fi
              sleep 3
            done

            echo "❌ La API no respondió al health check. Revisá:"
            docker compose -f docker-compose.prod.yml logs --tail 60 api
            exit 1
